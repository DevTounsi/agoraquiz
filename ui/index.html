<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgoraQuiz Bot</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --border: #272c3a;
      --text: #e6e9f0;
      --muted: #8b93a7;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      font-size: 19px;
      margin: 0;
    }
    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #1f2432;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge.running { color: var(--accent); border-color: var(--accent); }
    .badge.done { color: var(--ok); border-color: var(--ok); }
    .badge.error { color: var(--danger); border-color: var(--danger); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-update {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1f2432;
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .btn-update.available {
      background: #142b1d;
      color: #86efac;
      border-color: var(--ok);
    }
    .btn-update:disabled { opacity: 0.6; cursor: wait; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      color: var(--muted);
    }
    input, select {
      background: #0f1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .row > * { flex: 1; }

    .toggle {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      background: #0f1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
    }
    .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }

    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #111;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger {
      background: #2a181b;
      color: var(--danger);
      border: 1px solid #4c1d24;
    }
    .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

    .log-card {
      flex: 1;
      min-height: 160px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    pre#logs {
      margin: 0;
      flex: 1;
      overflow-y: auto;
      background: #0b0d12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: Consolas, "Cascadia Code", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <header>
    <h1>AgoraQuiz Bot <span id="versionTag" class="badge">v1.3.0</span></h1>
    <div class="header-right">
      <button id="updateBtn" class="btn-update" onclick="handleUpdateClick()">Vérifier MAJ</button>
      <span id="statusBadge" class="badge">Prêt</span>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="card-title">Compte &amp; Mode de jeu</div>
      <div class="row">
        <label>Identifiant
          <input id="username" type="text" placeholder="Identifiant" />
        </label>
        <label>Mot de passe
          <input id="password" type="password" placeholder="Mot de passe" />
        </label>
      </div>
      <div class="row">
        <label>Mode
          <select id="modeSelect" onchange="onModeChange()">
            <option value="all">Tous les modes (tous les tickets)</option>
            <option value="adventure" selected>Aventure</option>
            <option value="duel">Duels (Affrontements)</option>
            <option value="solo">Défis solo</option>
          </select>
        </label>
        <label>Nombre de parties (0 = max)
          <input id="quizCount" type="number" min="0" value="1" />
        </label>
      </div>
      <div class="row">
        <label id="quizNameWrap">Thème ciblé (optionnel)
          <input id="quizName" type="text" placeholder="Ex: Séquence 2, Java..." />
        </label>
        <label id="soloTypeWrap" style="display:none;">Type de défi solo
          <select id="soloType">
            <option value="Premier à 10" selected>Premier à 10 bonnes réponses</option>
            <option value="Contre la montre">Contre la montre</option>
            <option value="Mode survie">Mode survie</option>
          </select>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Modèle IA &amp; Convergence</div>
      <div class="row">
        <label>Modèle
          <select id="modelSelect" onchange="updateEffortOptions()">
            <option value="">Chargement...</option>
          </select>
        </label>
        <label>Effort
          <select id="effortSelect"></select>
        </label>
      </div>
      <label>Taux de convergence de réussite : <span id="rateLabel" style="color:var(--accent); font-weight:600;">80%</span>
        <input id="successRate" type="range" min="0" max="100" step="5" value="80" oninput="document.getElementById('rateLabel').textContent = this.value + '%'" style="padding:0;" />
      </label>
      <label class="toggle">
        <span>Afficher la fenêtre Chromium</span>
        <input id="showBrowser" type="checkbox" />
      </label>
      <label class="toggle">
        <span>Discussions éphémères (supprimer de agy)</span>
        <input id="ephemeralChat" type="checkbox" checked />
      </label>
    </div>
  </div>

  <div class="actions">
    <button id="startBtn" class="btn-primary" onclick="startBot()">Lancer le bot</button>
    <button id="stopBtn" class="btn-danger" onclick="stopBot()" disabled>Arrêter</button>
  </div>

  <div id="doneBanner" style="display:none; background:#142b1d; border:1px solid #22c55e; color:#86efac; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600;"></div>

  <div class="log-card">
    <div class="card-title">Journal d'exécution</div>
    <pre id="logs"></pre>
  </div>

  <script>
    let pollTimer = null;
    let groupedModels = [];
    let defaultEffort = "low";
    let pendingUpdateUrl = "";

    function setStatus(state, text) {
      const b = document.getElementById("statusBadge");
      b.className = "badge " + state;
      b.textContent = text;
    }

    let lastSingleModeCount = "1";

    function onModeChange() {
      const mode = document.getElementById("modeSelect").value;
      const showSolo = mode === "solo" || mode === "all";
      document.getElementById("soloTypeWrap").style.display = showSolo ? "flex" : "none";

      const countInput = document.getElementById("quizCount");
      if (mode === "all") {
        if (!countInput.disabled) {
          lastSingleModeCount = countInput.value || "1";
        }
        countInput.value = "0";
        countInput.disabled = true;
      } else if (countInput.disabled) {
        countInput.disabled = false;
        countInput.value = lastSingleModeCount || "1";
      }
    }

    function updateEffortOptions() {
      const baseId = document.getElementById("modelSelect").value;
      const group = groupedModels.find(g => g.id === baseId);
      const effSel = document.getElementById("effortSelect");
      effSel.innerHTML = "";
      if (!group) return;

      const entries = Object.entries(group.efforts);
      for (const [eff, fullId] of entries) {
        const opt = document.createElement("option");
        opt.value = eff;
        opt.dataset.modelId = fullId;
        opt.textContent = eff === "default" ? "standard" : eff;
        if (eff === defaultEffort) opt.selected = true;
        effSel.appendChild(opt);
      }
      if (!effSel.value && effSel.options.length > 0) {
        effSel.options[0].selected = true;
      }
    }

    async function init() {
      const data = await window.pywebview.api.get_initial_state();
      document.getElementById("username").value = data.config.username || "";
      document.getElementById("password").value = data.config.password || "";
      document.getElementById("quizName").value = data.config.quiz_name || "";

      groupedModels = data.models || [];
      defaultEffort = data.default_effort || "low";
      const rate = data.default_success_rate ?? 80;
      document.getElementById("successRate").value = rate;
      document.getElementById("rateLabel").textContent = rate + "%";

      const sel = document.getElementById("modelSelect");
      sel.innerHTML = "";
      for (const g of groupedModels) {
        const opt = document.createElement("option");
        opt.value = g.id;
        opt.textContent = g.label;
        if (g.id === data.default_base_model) opt.selected = true;
        sel.appendChild(opt);
      }
      updateEffortOptions();

      if (data.version) {
        document.getElementById("versionTag").textContent = "v" + data.version;
      }

      const logs = document.getElementById("logs");
      if (data.agy_status) {
        logs.textContent = data.agy_status + "\nDossier config/session : " + (data.data_dir || "") + "\n";
      }
      checkForUpdates(true);
    }

    async function checkForUpdates(silent = false) {
      const btn = document.getElementById("updateBtn");
      btn.disabled = true;
      btn.textContent = "Vérification...";
      const res = await window.pywebview.api.check_update();
      btn.disabled = false;
      if (res.available && res.download_url) {
        pendingUpdateUrl = res.download_url;
        btn.className = "btn-update available";
        btn.textContent = `Mettre à jour (${res.latest})`;
      } else {
        pendingUpdateUrl = "";
        btn.className = "btn-update";
        btn.textContent = res.ok ? `À jour (${res.latest})` : "Vérifier MAJ";
        if (!silent && !res.ok) {
          document.getElementById("logs").textContent += "Erreur MAJ : " + (res.error || "inconnue") + "\n";
        }
      }
    }

    async function handleUpdateClick() {
      if (!pendingUpdateUrl) {
        await checkForUpdates(false);
        return;
      }
      const btn = document.getElementById("updateBtn");
      btn.disabled = true;
      btn.textContent = "Téléchargement...";
      document.getElementById("logs").textContent += "Téléchargement de la mise à jour en cours...\n";
      const res = await window.pywebview.api.apply_update(pendingUpdateUrl);
      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = "Réessayer MAJ";
        document.getElementById("logs").textContent += "Erreur mise à jour : " + (res.error || "inconnue") + "\n";
      } else {
        document.getElementById("logs").textContent += "Mise à jour prête, redémarrage...\n";
      }
    }

    async function startBot() {
      try {
        const effSel = document.getElementById("effortSelect");
        const selectedOpt = effSel.options[effSel.selectedIndex];
        const fullModelId = selectedOpt ? selectedOpt.dataset.modelId : "gemini-4-hydrogen-low";

        const payload = {
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
          mode: document.getElementById("modeSelect").value,
          solo_type: document.getElementById("soloType").value,
          quiz_name: document.getElementById("quizName").value.trim(),
          model: fullModelId,
          effort: effSel.value || "low",
          success_rate: parseInt(document.getElementById("successRate").value || "80", 10),
          show_browser: document.getElementById("showBrowser").checked,
          ephemeral: document.getElementById("ephemeralChat").checked,
          count: parseInt(document.getElementById("quizCount").value || "1", 10),
        };

        if (!payload.username || !payload.password) {
          alert("Renseignez votre identifiant et votre mot de passe.");
          return;
        }

        document.getElementById("doneBanner").style.display = "none";
        document.getElementById("logs").textContent = "Démarrage...\n";
        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
        setStatus("running", "En cours...");

        const res = await window.pywebview.api.start(payload);
        if (!res.ok) {
          document.getElementById("logs").textContent += "Erreur : " + (res.error || "Impossible de démarrer.") + "\n";
          document.getElementById("startBtn").disabled = false;
          document.getElementById("stopBtn").disabled = true;
          setStatus("error", "Erreur");
          return;
        }

        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(pollLogs, 400);
      } catch (err) {
        document.getElementById("logs").textContent += "Erreur JS : " + err + "\n";
        document.getElementById("startBtn").disabled = false;
        document.getElementById("stopBtn").disabled = true;
        setStatus("error", "Erreur");
      }
    }

    async function stopBot() {
      document.getElementById("stopBtn").disabled = true;
      await window.pywebview.api.stop();
    }

    async function pollLogs() {
      const state = await window.pywebview.api.poll();
      if (state.lines.length) {
        const pre = document.getElementById("logs");
        pre.textContent += state.lines.join("\n") + "\n";
        pre.scrollTop = pre.scrollHeight;
      }
      if (!state.running) {
        clearInterval(pollTimer);
        pollTimer = null;
        document.getElementById("startBtn").disabled = false;
        document.getElementById("stopBtn").disabled = true;
        if (state.error) {
          setStatus("error", "Erreur");
        } else {
          const msg = state.summary || "Terminé";
          setStatus("done", msg);
          const banner = document.getElementById("doneBanner");
          banner.textContent = msg;
          banner.style.display = "block";
        }
      }
    }

    window.addEventListener("pywebviewready", init);
  </script>
</body>
</html>
